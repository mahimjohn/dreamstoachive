<div id="anime-player-wrapper"></div>

<script>
  // Simulating loading the configuration payload above
  const config = {
    embedUrl: "https://vidlink.pro",
    guards: ["allow-scripts", "allow-same-origin", "allow-forms"]
  };

  function injectPlayer(targetConfig) {
    const container = document.getElementById('anime-player-wrapper');
    const iframe = document.createElement('iframe');
    
    iframe.src = targetConfig.embedUrl;
    iframe.style.width = "100%";
    iframe.style.height = "500px";
    iframe.style.border = "none";
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
    
    // Applying sandbox parameters to block tracking/redirect advertisements
    iframe.setAttribute('sandbox', targetConfig.guards.join(' '));
    
    container.appendChild(iframe);
  }

  // Triggering the player window mount
  injectPlayer(config);
</script>
